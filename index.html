<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; }
        h1 { font-size: 60px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .score-container { display: flex; gap: 10px; margin: 15px 0; }
        .score-box { background: rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 20px; text-align: center; }
        .score-box .label { font-size: 12px; color: rgba(255,255,255,0.8); text-transform: uppercase; }
        .score-box .score { font-size: 24px; font-weight: bold; color: #fff; }
        button { background: rgba(255,255,255,0.9); border: none; border-radius: 8px; padding: 10px 20px; font-size: 16px; font-weight: bold; color: #667eea; cursor: pointer; }
        .game-board { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .tile { background: rgba(255,255,255,0.3); border-radius: 8px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; color: #fff; }
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }
        .game-over, .game-win { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(238, 228, 218, 0.73); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; z-index: 10; }
        .instructions { margin-top: 20px; text-align: center; color: rgba(255,255,255,0.8); font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div class="score-container">
            <div class="score-box"><div class="label">分数</div><div class="score" id="score">0</div></div>
            <div class="score-box"><div class="label">最高分</div><div class="score" id="best-score">0</div></div>
        </div>
        <button id="newGame">新游戏</button>
        <div class="game-board" id="board">
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        </div>
        <div class="instructions">
            <p>🎮 使用方向键或滑动移动方块</p>
            <p>🎉 合并相同数字达到2048获胜！</p>
        </div>
    </div>
    <script>
        class Game2048 {
            constructor() {
                this.board = []; this.score = 0; this.bestScore = parseInt(localStorage.getItem('bestScore')||'0'); this.gameOver = false; this.won = false; this.init();
            }
            init() {
                this.board = Array(4).fill(null).map(()=>Array(4).fill(0)); this.score = 0; this.gameOver = false; this.won = false;
                this.addRandomTile(); this.addRandomTile(); this.updateUI();
            }
            addRandomTile() {
                const empty = [];
                for(let i=0;i<4;i++) for(let j=0;j<4;j++) if(this.board[i][j]===0) empty.push({row:i,col:j});
                if(empty.length>0) {
                    const r = empty[Math.floor(Math.random()*empty.length)];
                    this.board[r.row][r.col] = Math.random()<0.9?2:4;
                }
            }
            move(d) {
                if(this.gameOver) return false;
                let moved = false;
                switch(d) {
                    case 'up': moved = this.moveUp(); break;
                    case 'down': moved = this.moveDown(); break;
                    case 'left': moved = this.moveLeft(); break;
                    case 'right': moved = this.moveRight(); break;
                }
                if(moved) { this.addRandomTile(); this.checkGameOver(); this.updateUI(); }
                return moved;
            }
            moveLeft() {
                let m = false;
                for(let i=0;i<4;i++) {
                    let row = this.board[i].filter(x=>x!==0);
                    for(let j=0;j<row.length-1;j++) {
                        if(row[j]===row[j+1]) { row[j]*=2; this.score+=row[j]; row.splice(j+1,1); m=true; }
                    }
                    while(row.length<4) row.push(0);
                    if(JSON.stringify(row)!==JSON.stringify(this.board[i])) { m=true; this.board[i]=row; }
                }
                return m;
            }
            moveRight() {
                let m = false;
                for(let i=0;i<4;i++) {
                    let row = this.board[i].filter(x=>x!==0);
                    for(let j=row.length-1;j>0;j--) {
                        if(row[j]===row[j-1]) { row[j]*=2; this.score+=row[j]; row.splice(j-1,1); m=true; }
                    }
                    while(row.length<4) row.unshift(0);
                    if(JSON.stringify(row)!==JSON.stringify(this.board[i])) { m=true; this.board[i]=row; }
                }
                return m;
            }
            moveUp() {
                let m = false;
                for(let j=0;j<4;j++) {
                    let col = [];
                    for(let i=0;i<4;i++) if(this.board[i][j]!==0) col.push(this.board[i][j]);
                    for(let i=0;i<col.length-1;i++) {
                        if(col[i]===col[i+1]) { col[i]*=2; this.score+=col[i]; col.splice(i+1,1); m=true; }
                    }
                    while(col.length<4) col.push(0);
                    for(let i=0;i<4;i++) if(this.board[i][j]!==col[i]) { m=true; this.board[i][j]=col[i]; }
                }
                return m;
            }
            moveDown() {
                let m = false;
                for(let j=0;j<4;j++) {
                    let col = [];
                    for(let i=0;i<4;i++) if(this.board[i][j]!==0) col.push(this.board[i][j]);
                    for(let i=col.length-1;i>0;i--) {
                        if(col[i]===col[i-1]) { col[i]*=2; this.score+=col[i]; col.splice(i-1,1); m=true; }
                    }
                    while(col.length<4) col.unshift(0);
                    for(let i=0;i<4;i++) if(this.board[i][j]!==col[i]) { m=true; this.board[i][j]=col[i]; }
                }
                return m;
            }
            checkGameOver() {
                for(let i=0;i<4;i++) for(let j=0;j<4;j++) if(this.board[i][j]===2048) { this.won=true; return; }
                for(let i=0;i<4;i++) for(let j=0;j<4;j++) {
                    if(this.board[i][j]===0) return;
                    if(i<3&&this.board[i][j]===this.board[i+1][j]) return;
                    if(j<3&&this.board[i][j]===this.board[i][j+1]) return;
                }
                this.gameOver=true;
            }
            updateUI() {
                document.getElementById('score').textContent=this.score;
                if(this.score>this.bestScore) { this.bestScore=this.score; localStorage.setItem('bestScore',this.bestScore); }
                document.getElementById('best-score').textContent=this.bestScore;
                const tiles=document.querySelectorAll('.tile');
                let idx=0;
                for(let i=0;i<4;i++) for(let j=0;j<4;j++) {
                    const t=tiles[idx++];
                    const v=this.board[i][j];
                    t.textContent=v?v:''; t.className='tile';
                    if(v) t.classList.add(`tile-${v}`);
                }
                this.updateGameStatus();
            }
            updateGameStatus() {
                const b=document.getElementById('board');
                const o=b.querySelector('.game-over,.game-win');
                if(o) b.removeChild(o);
                if(this.won) {
                    const overlay=document.createElement('div');
                    overlay.className='game-win';
                    overlay.innerHTML='<h2>🎉</h2><p>恭喜获胜！</p><button onclick="game.init()">再来一局</button>';
                    b.style.position='relative'; b.appendChild(overlay);
                } else if(this.gameOver) {
                    const overlay=document.createElement('div');
                    overlay.className='game-over';
                    overlay.innerHTML='<h2>😢</h2><p>游戏结束</p><button onclick="game.init()">新游戏</button>';
                    b.style.position='relative'; b.appendChild(overlay);
                }
            }
        }
        const game=new Game2048();
        document.getElementById('newGame').addEventListener('click',()=>game.init());
        document.addEventListener('keydown',e=>{
            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); game.move('up'); break;
                case 'ArrowDown': e.preventDefault(); game.move('down'); break;
                case 'ArrowLeft': e.preventDefault(); game.move('left'); break;
                case 'ArrowRight': e.preventDefault(); game.move('right'); break;
            }
        });
        let sx=0,sy=0;
        document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
        document.addEventListener('touchend',e=>{
            const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
            if(Math.abs(dx)>Math.abs(dy)) {
                if(Math.abs(dx)>50) game.move(dx>0?'right':'left');
            } else {
                if(Math.abs(dy)>50) game.move(dy>0?'down':'up');
            }
        },{passive:true});
    </script>
</body>
</html>
